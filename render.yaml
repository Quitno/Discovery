services:
  - type: web
    name: patamahali-marketplace
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python cache_gallery_images.py
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /
    disk:
      name: patamahali-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://trorinovationstech.co.ke
